# Vault — inside the vault, sodium light on stone
# The warm wins. Charcoal-sepia ground, sand text. The monolith's interior.

mode                     = "dark"

# Signal, selection and the de-emphasised ramp
accent                   = "#e09355"
selection                = "#3a2f22"
muted                    = "#867658"

# Ground, from the deepest surface up to the elevated one
background               = "#191510"
dark_background          = "#131009"
darker_background        = "#0d0b07"
lighter_background       = "#272018"

# Text, from de-emphasised up to the cursor
foreground               = "#d3c0a8"
dark_foreground          = "#8b7a62"
light_foreground         = "#e2d3bd"
bright_foreground        = "#f4e9d7"

# Window borders. Also drives the shell's border tokens.
hyprland_active_border   = "rgba(e09355ee) rgba(d9ab5eee) 45deg"
hyprland_inactive_border = "rgba(3a2f22aa)"

# Named colours
red                      = "#db6c4f"
yellow                   = "#d9ab5e"
orange                   = "#e09355"
green                    = "#9cba64"
cyan                     = "#63b8a6"
blue                     = "#79a5cc"
magenta                  = "#cd8ba4"
brown                    = "#96603c"

# Bright variants
bright_red               = "#e0755a"
bright_yellow            = "#e9c07c"
bright_green             = "#b3ce80"
bright_cyan              = "#84cebf"
bright_blue              = "#9bbcdd"
bright_magenta           = "#dda5b8"
