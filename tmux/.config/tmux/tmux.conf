### PREFIX #####

unbind C-b
set -g prefix C-a
bind C-a send-prefix

##### TERMINAL #####

set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"

##### GENERAL #####

set -g mouse on

set -g history-limit 100000

set -g base-index 1
setw -g pane-base-index 1

set -g renumber-windows on

set -g detach-on-destroy off

set -g escape-time 0

##### COPY MODE (VIM) #####

setw -g mode-keys vi

bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

##### SPLITS #####

bind c new-window -c "#{pane_current_path}"

bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

##### PANE NAVIGATION #####

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

##### RESIZE #####

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

##### WINDOW NAMES #####

set -g allow-rename off
set -g automatic-rename off

##### RELOAD #####

bind r source-file ~/.config/tmux/tmux.conf \; display-message "Reloaded tmux config"

##### TPM #####

set -g @plugin 'tmux-plugins/tpm'

set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @plugin 'christoomey/vim-tmux-navigator'

set -g @plugin 'catppuccin/tmux'

##### CONTINUUM #####

set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

##### CATPPUCCIN #####

set -g @catppuccin_flavor 'mocha'

# Показывать имя окна (#W), а не title (#T)
set -g @catppuccin_window_text "#I:#W"
set -g @catppuccin_window_current_text "#I:#W"

# Модули справа
set -g @catppuccin_status_modules_right "directory session date_time"

# Формат времени
set -g @catppuccin_date_time "%H:%M"

##### TPM #####

run '~/.config/tmux/plugins/tpm/tpm'

# Меняем префикс с Ctrl+b на Ctrl+a
unbind C-b
set -g prefix C-a
bind C-a send-prefix

##### General #####

# Нумерация окон начинается с 1
set -g base-index 1

# Нумерация панелей начинается с 1
set -g pane-base-index 1

# Новые окна наследуют текущую директорию
bind c new-window -c "#{pane_current_path}"

# Новые панели тоже
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Быстрее повторять команды
set -sg repeat-time 300

# Большая история
set -g history-limit 100000

##### Vim #####

# Использовать Vim-горячие клавиши в copy mode
setw -g mode-keys vi

# Начать выделение
bind-key -T copy-mode-vi v send-keys -X begin-selection

# Копировать выделение
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

##### Навигация между панелями #####

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

##### Изменение размера панелей #####

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

##### Быстрая перезагрузка конфига #####

bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux config reloaded"

##### Мышь #####

set -g mouse on

##### Терминал #####

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:Tc"

##### Статусбар #####

set -g status-position bottom
# set -g status-interval 5

##### Окна #####

set -g renumber-windows on

##### Закрытие #####

set -g detach-on-destroy off

set -g status-left "#[bold]#S "
set -g status-right "%H:%M"

# Не переименовывать окна автоматически
set -g allow-rename off
set -g automatic-rename off

##### Plugins #####

# TPM
set -g @plugin 'tmux-plugins/tpm'

# Сохранение и восстановление сессий
set -g @plugin 'tmux-plugins/tmux-resurrect'

# Автоматическое сохранение
set -g @plugin 'tmux-plugins/tmux-continuum'

# Навигация между tmux и Neovim
