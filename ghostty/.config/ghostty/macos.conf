# macOS-only Ghostty settings, merged into ~/.config/ghostty/config.ghostty
# by bin/merge-ghostty-config.sh

font-size = 13
background-opacity = 0.90
background-blur = 10
keybind = global:super+;=toggle_quick_terminal
macos-icon = retro

# Free these so herdr can use Alt+Left/Right for tabs and Cmd+Left/Right stops
# sending Ctrl+A (herdr's prefix) / Ctrl+E into the session.
keybind = super+arrow_left=unbind
keybind = super+arrow_right=unbind
keybind = alt+arrow_left=unbind
keybind = alt+arrow_right=unbind
